<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B766E">
<title>{{TITLE}} – ดีลชัวร์ (DealSure)</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" type="image/png" href="/static/logo/favicon-32.png">
<link rel="apple-touch-icon" href="/static/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=8">
</head>
<body>
<div class="app notabs legal-page" id="app">
<!--SPRITE-->
  <div class="top"><div class="row">
    <a class="icon-btn" href="/" aria-label="ย้อนกลับ" onclick="if(document.referrer.indexOf(location.origin)===0&&history.length>1){history.back();return false}"><svg width="20" height="20"><use href="#back"/></svg></a>
    <a class="brand" href="/" style="font-size:15px;color:#fff;text-decoration:none"><svg class="lg" width="28" height="28" role="img" aria-label="โลโก้ดีลชัวร์"><use href="#logoA"/></svg>ดีลชัวร์</a>
    <span style="width:38px"></span>
  </div><h1>{{TITLE}}</h1><p class="sub">{{META}}</p></div>
  <div class="wrap">
    <nav class="seg legal-switch" aria-label="เอกสาร">
      <a href="/terms" class="{{ON_TERMS}}">ข้อตกลงการใช้บริการ</a><a href="/privacy" class="{{ON_PRIVACY}}">ความเป็นส่วนตัว</a>
    </nav>
    {{SUMMARY}}
    <details class="card legal-toc"><summary><svg width="18" height="18"><use href="#list"/></svg>สารบัญ <span class="muted small">{{NSEC}} หัวข้อ</span></summary><ol>{{TOC}}</ol></details>
    <article class="legal-body" id="legalBody">{{BODY}}</article>
    <div class="card legal-end">
      <p class="small muted">มีคำถามเกี่ยวกับเอกสารนี้? ทักทีมงานผ่านเมนู “แชท” ในแอป หรืออีเมล [อีเมลติดต่อ]</p>
      <div class="twobtn mt12"><a class="btn ghost sm" href="{{OTHER_HREF}}">{{OTHER_LABEL}}</a><a class="btn primary sm" href="/">กลับไปที่แอป</a></div>
    </div>
    <p class="footer-note">ดีลชัวร์ (DealSure) · เอกสารฉบับร่าง · <a href="/terms">ข้อตกลง</a> · <a href="/privacy">ความเป็นส่วนตัว</a></p>
  </div>
</div>
</body>
</html>
