services:
  - type: web
    name: dealsure-prototype
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_TEST_SECRET_KEY   # ไม่บังคับ: sk_test_... เปิดจ่ายบัตรผ่าน Stripe test mode (ไม่ตั้ง = เงินจำลอง)
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
