services:
  - type: web
    name: dealsure-prototype
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
